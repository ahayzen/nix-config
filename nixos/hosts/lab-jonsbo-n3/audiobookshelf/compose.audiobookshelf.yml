services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:v3@sha256:32da00b8ea7359ae99b874f4e92b456c04444eed43570d4f1902aec882c75988
    expose:
      - 80
    networks:
      - group-proxy
    volumes:
      # Backup the database
      - /var/cache/docker-compose-runner/audiobookshelf/config:/config
      # We do not need to backup the podcasts content or metadata
      - /var/cache/docker-compose-runner/audiobookshelf/podcasts:/podcasts
      - /var/cache/docker-compose-runner/audiobookshelf/metadata:/metadata
      # TODO: could add audiobook storage and support
    environment:
      - TZ=Europe/London

  traefik:
    volumes:
      - /etc/traefik/dynamic/traefik.audiobookshelf.yml:/etc/traefik/dynamic/traefik.audiobookshelf.yml:ro
