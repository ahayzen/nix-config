services:
  actual:
    image: ghcr.io/actualbudget/actual:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    environment:
      # Trust traefik, group-proxy, and VPN tunnel
      ACTUAL_TRUSTED_PROXIES: "172.20.20.0/24,172.28.228.128/25"
    expose:
      - "5006"
    networks:
      - group-proxy
    restart: unless-stopped
    volumes:
      - /var/lib/docker-compose-runner/actual/data:/data

  traefik:
    volumes:
      - /etc/traefik/dynamic/traefik.actual.yml:/etc/traefik/dynamic/traefik.actual.yml:ro
