# Configure the letsencrypt resolver to use the acmedns
#
# NOTE: env vars are set on the container to for ACME_DNS_*
certificatesResolvers:
  letsencrypt:
    acme:
      email: ahayzen@gmail.com
      storage: /var/lib/docker-compose-runner/traefik/acme/acme-certificates.json
      dnsChallenge:
        provider: acme-dns

# Configure all routers to be default use the letsencrypt resolver
entryPoints:
  websecure:
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hayzen.uk"
            sans: "*.hayzen.uk"
