services:
  traefik:
    image: docker.io/library/traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    # NOTE: we use environment as the single source of truth for static config
    environment:
      # Listen for http
      - TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
      # Listen for https with tls
      #
      # NOTE: If no certificate are set, a default self-signed certificate is generated by Traefik
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS=true
      # Increase timeouts, this is useful for immich and likely others
      #
      # https://docs.immich.app/administration/reverse-proxy/#traefik-proxy-example-config
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT=600s
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_IDLETIMEOUT=600s
      # Redirect http traffic to https
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO=websecure
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME=https
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT=true
      # Trusted VPN IPs so that X-Forwarded-* is passed through
      - TRAEFIK_ENTRYPOINTS_WEB_FORWARDEDHEADERS_TRUSTEDIPS=172.28.228.128/25
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_FORWARDEDHEADERS_TRUSTEDIPS=172.28.228.128/25
      # Enable INFO logging so we know when the service starts
      #
      # NOTE: use DEBUG when retrieving the _acme-challenge
      - TRAEFIK_LOG_LEVEL=INFO
      # Enable access logging
      - TRAEFIK_ACCESSLOG=true
      # Load configuration from directory
      - TRAEFIK_PROVIDERS_FILE_DIRECTORY=/etc/traefik/dynamic
      - TRAEFIK_PROVIDERS_FILE_WATCH=true
    networks:
      - group-proxy
    ports:
      - "80:80"
      - "443:443"
