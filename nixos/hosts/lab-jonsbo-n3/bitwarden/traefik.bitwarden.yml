http:
  routers:
    bitwarden:
      rule: Host(`bitwarden.hayzen.uk`)
      entryPoints:
        - websecure
      service: bitwarden

  services:
    bitwarden:
      loadBalancer:
        servers:
          - url: http://bitwarden:8080
