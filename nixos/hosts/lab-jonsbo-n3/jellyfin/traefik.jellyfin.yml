http:
  routers:
    jellyfin:
      rule: Host(`jellyfin.hayzen.uk`)
      entryPoints:
        - websecure
      service: jellyfin

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: http://jellyfin:8096
