hf-file = gemma-4-12b-it-qat-q4_0.gguf
alias = google/gemma-4:12b
temperature = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-26B-A4B-it-qat-q4_0-gguf:IT]
hf-repo = google/gemma-4-26B-A4B-it-qat-q4_0-gguf
hf-file = gemma-4-26B_q4_0-it.gguf
